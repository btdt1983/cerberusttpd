# Cerberusttpd settings. One "key = value" per line; keys are the command-line
# flag names, and a flag given on the command line overrides this file.
# Restart after changes: systemctl restart cerberusttpd

# Address to listen on: TCP for HTTP/1.1 and HTTP/2, UDP for HTTP/3.
# nginx owns 80/443 on this machine, so 8443 it is. Below 1024 also works
# (the unit allows CAP_NET_BIND_SERVICE) once the port is free.
addr = :8443

# Directory shared with every user. Empty (default) means each user's own home
# directory. Whatever you set, users only reach what Linux lets them reach.
# Note: the unit makes /usr and /etc read-only; a root there needs ReadWritePaths.
root =

# Where the CA key, 2FA records and certificates live (root only).
# Back up ca/ca-key.pem, 2fa.key and the 2fa/ directory.
data = /var/lib/cerberusttpd

# Certificate mode: "local" is a private CA (import ca.crt once per device).
# "acme" (public domain) needs the TLS listener on :443, which is not possible
# while nginx holds it; use DNS-01 or an nginx passthrough when you get there.
tls = local

# Extra DNS names / IPs in the local certificate, comma separated. localhost,
# 127.0.0.1, ::1, the hostname and every interface address are always included;
# add a DNS name, or an address that may not exist yet at early boot.
#names = files.example.lan,192.168.0.10

# Two-factor login: "required" (everyone sets up an authenticator app) or "off".
2fa = required

# Largest upload in bytes (default 20 GiB; 0 = unlimited).
max-upload = 21474836480

# Abandoned uploads untouched for this long are removed, as the user who made
# them (so only where that user may delete). 0 disables.
stale-after = 168h

# Lowest uid allowed to log in (system accounts stay out).
min-uid = 1000

# Unprivileged account for the network process, and the PAM service name
# (/etc/pam.d/<name>).
user = cerberusttpd
pam-service = cerberusttpd
